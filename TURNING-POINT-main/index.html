<!doctype html>
<html lang="en" data-theme="color">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turning Point — Delhi Art Biennale 2026</title>
  <meta name="description" content="Turning Point is an installation project by Anant University for the Delhi Art Biennale 2026: four spiralling steel columns, perforated with patterns of emergent life-processes.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Turning Point">
  <meta property="og:description" content="An installation by Anant University for the Delhi Art Biennale 2026.">
  <meta property="og:image" content="assets/img/process/render-01.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/tp-display-bold-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/tp-text.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <!-- the layout from admin/layout.html ("Save to site"); delete the file to go back to style.css alone -->
  <link rel="stylesheet" href="css/layout.css">
  <link rel="preload" href="assets/img/texture-blue.jpg" as="image">
  <script>if (/[?&]grid\b/.test(location.search)) document.documentElement.classList.add("show-grid");</script>

  <script>
    document.documentElement.classList.add("js");
    // ?theme=color shows the coloured version, ?theme=mono the black-and-white one
    (function () { var t = new URLSearchParams(location.search).get("theme");
      if (t === "color" || t === "mono") document.documentElement.dataset.theme = t; })();
  </script>
</head>
<body>
  <!-- faint pattern that grows under a resting cursor / a tap (js/main.js §6) -->
  <canvas id="idle" aria-hidden="true"></canvas>

  <div class="frame" id="frame">
    <!-- The finer, still pattern behind the strips (a pre-rendered tile) -->
    <div class="bgpat" id="bgpat" aria-hidden="true"><div class="bgpat__tile"></div></div>

    <!-- One canvas draws the perforated steel strips (moved between hosts by main.js) -->
    <canvas id="pattern" aria-hidden="true"></canvas>

    <!-- Where the pattern sits on the home view; the sliver is the right-edge strip -->
    <div class="stage" id="stage" aria-hidden="true"></div>
    <div class="sliver" id="sliver" aria-hidden="true"></div>
    <div class="mark" id="mark" aria-hidden="true"></div>
    <div class="org" id="org"><img src="assets/img/anu-logo.png" alt="Anant National University" width="560" height="224"></div>

    <!-- Right column: meta, title, menu. Slides away when a section is open. -->
    <aside class="side" id="side">
      <p class="meta" id="meta"></p>
      <h1 class="title" id="title">
        <a href="#" id="homeLink" aria-label="Turning Point — home">Turning Point</a>
      </h1>
      <nav class="nav" id="nav" aria-label="Sections">
        <div class="nav__list" id="navList"></div>
      </nav>
    </aside>

    <section class="intro" id="intro" aria-label="About the project"></section>

    <main class="panel" id="panel" tabindex="-1" aria-live="polite"></main>

    <p class="skip-hint" id="skipHint">click to skip</p>
  </div>

  <!-- Desktop: hovering the right edge brings the menu back while a section is open -->
  <button class="side-hot" id="sideHot" type="button" aria-label="Show menu"></button>

  <!-- a slight ink bleed for the larger type (black-and-white theme) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="ink" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".35" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="d"/></feMerge>
    </filter>
  </svg>

  <noscript>
    <style>.stage{background:url(assets/img/texture-blue.jpg) center/cover}</style>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/rd.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
