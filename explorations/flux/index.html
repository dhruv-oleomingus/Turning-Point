<style>
/* VOICE: wordless; the work alone, seen from a standing eye.
   IDEA: an hourglass — the whole image turns over and the structure pours out into the air.
   PICTURE: four cor-ten columns on their plinth, horizon on the centre line, which is the neck of the glass.
   COLOUR: flat dust haze inside the frame, a dark surround outside it.
   LAYOUT: one centred frame the shape of a postcard (3:2; 2:3 on a tall screen — explore.js), Back and
   Postcard beside it on the left. */
:root{--surround:#888888;--haze:#dcd2c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--surround)}
#stage{position:fixed;left:50%;top:50%;width:100vw;height:100vh;transform-origin:50% 50%;background:var(--haze);
  translate:-50% -50%;opacity:0;transition:opacity 1.2s ease}
#stage.ready{opacity:1}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.nav{position:absolute;left:50%;translate:-50% 0;width:48px;height:48px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;
  background:transparent;color:#2a2119;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s ease}
.nav svg{width:30px;height:30px}
.nav.on{opacity:.75;pointer-events:auto}
.nav.on:hover{opacity:1}
.nav:focus-visible{outline:2px solid #2a2119;outline-offset:2px}
#up{top:max(10px,env(safe-area-inset-top))}
#up.invite.on svg{animation:bob 2.4s ease-in-out infinite}
#down{bottom:max(10px,env(safe-area-inset-bottom))}
@keyframes bob{50%{transform:translateY(-5px)}}
#down.invite.on svg{animation:bobDown 2.4s ease-in-out infinite}
@keyframes bobDown{50%{transform:translateY(5px)}}
#passage{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(44ch,84%);max-height:72%;overflow-y:auto;overscroll-behavior:contain;
  margin:0;padding:0 6px;font:400 clamp(15px,1.75vmin,18px)/1.6 Roboto,Arial,sans-serif;color:#2a2119;text-wrap:pretty;
  opacity:0;pointer-events:none;transition:opacity 1.4s ease;scrollbar-width:thin;scrollbar-color:rgba(42,33,25,.35) transparent;
  -webkit-mask-image:linear-gradient(transparent,#000 1.2em,#000 calc(100% - 1.2em),transparent);mask-image:linear-gradient(transparent,#000 1.2em,#000 calc(100% - 1.2em),transparent)}
#passage p{margin:1.2em 0}
#passage.on{opacity:1;pointer-events:auto}
@media(prefers-reduced-motion:reduce){#up.invite.on svg,#down.invite.on svg{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>

  <div id="passage" tabindex="0" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
{
const D2R = Math.PI / 180, PI = Math.PI;
const coarse = matchMedia('(pointer:coarse)').matches;
const TEX = (coarse || Math.min(innerWidth, innerHeight) < 600) ? 512 : 1024;
/* which textures the boxes wear:
   "atlas" — one picture per column, assets/tex/atlas/col-1.png … col-4.png: every arm of the column in a row, top arm
             first, each side laid out as one continuous panel (Side A, Side B, pivot ends, tip ends, tops), so a whole
             side of a column is painted at once. col-<n>-guide.png outlines the faces, as a layer to paint over. Paint
             in place and keep the size; tools/make_atlas.py rebuilds the atlases from the separate textures below.
   "png"   — the separate textures in assets/tex/1024 png/ (col-1Box-01.png …), one an arm;
   "webp"  — the cor-ten set (assets/tex/512|1024/P1_Box-01.webp …).
   Try another with ?tex=png / ?tex=webp */
const TEX_SET = new URLSearchParams(location.search).get('tex') || 'atlas';
const texURL = (key, set = TEX_SET) => set === 'webp'
  ? `assets/tex/${TEX}/${key}.webp`
  : `assets/tex/1024%20png/${key.replace(/^P(\d)_Box-/, 'col-$1Box-')}.png`;
const ATLAS = TEX_SET === 'atlas'
  ? fetch('assets/tex/atlas/atlas.json').then(r => r.ok ? r.json() : null).catch(() => null)
  : Promise.resolve(null);

/* tune freely */
const EYE = 1.65;                                         /* standing eye height = horizon = flip axis */
const FLIP_DUR = 3.0, ROLL_DUR = 1.2;
const STAG_APART = 0.07, STAG_GATHER = 0.055;             /* seconds between successive arms (plus a little at random, coming apart) */
const SPIN_SPEED = 0;                                     /* rad/s while inverted (0: it holds still as it comes apart; it was 0.14) */
const LIT = false;                                        /* false: no lights or shadows — every surface shows its texture evenly */
const PL = 48.8;                                          /* ground slab: 4 × the 40 ft plinth */
const HAZE = '#dcd2c4';
const LOOK_MAX = 80 * D2R;
const CLOSER = 0.69;                                      /* camera distance × this: 0.69 ≈ 31% closer than the framing that shows it all */                                /* how far you tilt up to meet the upturned ground */

/* passages read on the underside of the upturned ground — one is drawn at random each time */
const PASSAGES = [
  `Do you not know that there lies a journey of some months between us and the land of our birth and our familiar city? If our side is defeated, (God preserve us from that day! God forbid it!) where are we? where is our birthplace? where our city? We have to do with strangers and foreigners. It is in every way best for each man to set resolutely before himself the two alternatives: if we win, we are avengers of the cause of God; if we lose, we die martyrs. In either fate is our salvation; each is a step and upward stage in greatness.

(Babur’s exile)`,
];

/* the second passage: once the first has been read and the image turned back the right way up, an arrow at
   the bottom tilts the view down to the ground, where this is read — one drawn at random each time */
const PASSAGES_BELOW = [
  `For five years we had been shut out and cut off from this pleasure, so now when we were freed from the moil and pain of separation, we were lifted up by our happiness in meeting this Lord of beneficence again. Merely to look at him eased the sorrow-stricken heart and purged the blur-eyed vision. Again and again we joyfully made the prostration of thanks. There were many festive gatherings, and people sat from evening to dawn, and players and singers made continuous music. Many amusing games, full of fun, were played. Amongst them was this: Twelve players had each twenty cards and twenty shahrukhis. Whoever lost, lost those twenty shahrukhis, which would make five misqals. Each player gave the winner his twenty shahrukhis to add to his own.

(Humayun’s return)`,
];

/* ---------- renderer, scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 2 : 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = LIT;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(HAZE);

/* everything that turns over lives in `content`; `world` is the pivot on the horizon line */
const world = new THREE.Group(), content = new THREE.Group(), structure = new THREE.Group();
world.position.set(0, EYE, 0);
content.position.set(0, -EYE, 0);
world.add(content); content.add(structure); scene.add(world);

const plinth = new THREE.Mesh(new THREE.BoxGeometry(PL, 0.06, PL), LIT
  ? new THREE.MeshStandardMaterial({color: '#d8c9b3', roughness: 0.95})
  : new THREE.MeshBasicMaterial({color: '#d8c9b3', toneMapped: false}));
plinth.position.y = -0.03; plinth.receiveShadow = LIT;
content.add(plinth);

/* lights turn over with the image too */
const hemi = new THREE.HemisphereLight('#e2e8ea', '#9f805d', 1.25);
hemi.position.set(0, 1000, 0);
const sun = new THREE.DirectionalLight('#ffdfbb', 2.9);
sun.position.set(-9, 8.5, 5); sun.target.position.set(0, 1, 0);
sun.castShadow = LIT;
sun.shadow.mapSize.setScalar(coarse ? 1024 : 2048);
Object.assign(sun.shadow.camera, {left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 45});
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.025;
content.add(hemi, sun, sun.target);

/* ---------- camera: a person standing beside the work, looking level ---------- */
const camera = new THREE.PerspectiveCamera(50, 4 / 3, 0.1, 400);
const view = {az: -0.5, vel: 0, dist: 14};
function layout() {
  /* the postcard's shape, centred (explore.js); Back and Postcard beside it */
  const m = TPX.upright() ? 56 : Math.round(innerHeight * 0.03);
  const r = TPX.fit({top: m, bottom: m, side: innerWidth > 820 ? 170 : 8}), w = r.w, h = r.h;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  TPX.rail(r);
  renderer.setSize(w, h);
  const asp = w / h;
  camera.aspect = asp;
  camera.fov = asp < 0.8 ? 64 : 50;
  const tv = Math.tan(camera.fov * D2R / 2), th = tv * asp;
  view.dist = Math.max(14, 6.6 / tv, (asp < 0.8 ? 4.4 : 7.5) / th) * CLOSER;
  camera.updateProjectionMatrix();
}
layout();
addEventListener('resize', layout);

/* drag to walk around; a tap (no drag) turns it over */
const cv = renderer.domElement;
let drag = null;
cv.addEventListener('pointerdown', e => {
  drag = {id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: e.timeStamp, t0: e.timeStamp, axis: null};
  view.vel = 0; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.axis && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8)
    drag.axis = (canLook() && Math.abs(e.clientY - drag.y0) > Math.abs(e.clientX - drag.x0)) ? 'y' : 'x';
  if (drag.axis === 'y') {
    if (look.target === 0) look.dir = lookDir();
    look.target = Math.min(1, Math.max(0, look.target + (e.clientY - drag.y) * look.dir * (rollParity ? -1 : 1) / (cv.clientHeight * 0.6)));
    drag.x = e.clientX; drag.y = e.clientY; return;
  }
  const dx = (e.clientX - drag.x) * (rollParity ? -1 : 1), dt = Math.max(8, e.timeStamp - drag.t) / 1000;
  const d = -dx * 0.0055;
  view.az += d; view.vel = view.vel * 0.5 + (d / dt) * 0.5;
  drag.x = e.clientX; drag.y = e.clientY; drag.t = e.timeStamp;
});
cv.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0), held = e.timeStamp - drag.t0;
  drag = null;
  if (moved < 8 && held < 350 && look.s < 0.05) { wantFlipped = !wantFlipped; view.vel = 0; }
});
cv.addEventListener('pointercancel', () => { drag = null; });

/* ---------- state ---------- */
const arms = [];
let order = [], seq = 0, ready = false, spin = 0, spinV = 0;
let flipped = false, wantFlipped = false, rollParity = false, rollDeg = 0;
const qFlip = new THREE.Quaternion(), qTmp = new THREE.Quaternion(), qTmp2 = new THREE.Quaternion();
const Y = new THREE.Vector3(0, 1, 0), X = new THREE.Vector3(1, 0, 0);
const invContent = new THREE.Matrix4(), mTmp = new THREE.Matrix4();
const anim = {on: false, t0: 0, dur: FLIP_DUR, axis: new THREE.Vector3(), q0: new THREE.Quaternion(), g: 0, r0: 0, r1: 0};

const ease = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
const smooth = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const rnd = (a, b) => a + Math.random() * (b - a);
function bez(o, a, b, c, d, t) {
  const u = 1 - t, w0 = u * u * u, w1 = 3 * u * u * t, w2 = 3 * u * t * t, w3 = t * t * t;
  return o.set(a.x * w0 + b.x * w1 + c.x * w2 + d.x * w3, a.y * w0 + b.y * w1 + c.y * w2 + d.y * w3, a.z * w0 + b.z * w1 + c.z * w2 + d.z * w3);
}

function startAnim(turn, roll, now) {
  anim.on = true; anim.t0 = now;
  anim.g = turn ? PI : 0;
  anim.dur = turn ? FLIP_DUR : ROLL_DUR;
  anim.axis.set(camera.position.x, 0, camera.position.z).normalize();   /* the line of sight: the image turns in its own plane */
  anim.q0.copy(qFlip);
  anim.r0 = rollDeg; anim.r1 = rollDeg + (roll ? 180 : 0);
  if (roll) rollParity = !rollParity;
  if (turn) { flipped = !flipped; schedule(flipped, now + anim.dur); look.target = 0; }
}

function schedule(toFlipped, at) {
  if (toFlipped) {
    let i = 0;
    for (const a of order) {
      if (a.mode === 'home') a.pend = {type: 'fall', at: at + 0.3 + (i++) * STAG_APART + rnd(0, 0.35)};
      else if (a.mode === 'rise') a.pend = {type: 'fall', at};
      else a.pend = null;
    }
  } else {
    arms.filter(a => a.mode === 'float').sort((p, q) => q.seq - p.seq)
      .forEach((a, i) => a.pend = {type: 'rise', at: at + 0.2 + i * STAG_GATHER});
    for (const a of arms) {
      if (a.mode === 'fall') a.pend = {type: 'rise', at};
      else if (a.mode === 'home') a.pend = null;
    }
  }
}

/* ---------- arm motion (all poses in content space) ---------- */
const slotP = new THREE.Vector3(), slotQ = new THREE.Quaternion(), slotS = new THREE.Vector3(), slotO = new THREE.Vector3();
const cNow = new THREE.Vector3(), qNow = new THREE.Quaternion();
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), vD = new THREE.Vector3();
const gL = new THREE.Vector3();                           /* gravity, in content space */
function centerOf(a, out) { return out.copy(a.lc).applyQuaternion(a.mesh.quaternion).add(a.mesh.position); }
function place(a, center, q) { a.mesh.quaternion.copy(q); a.mesh.position.copy(a.lc).applyQuaternion(q).negate().add(center); }
function slotPose(a) {
  mTmp.multiplyMatrices(invContent, a.slot.matrixWorld).decompose(slotO, slotQ, slotS);
  return slotP.copy(a.lc).applyQuaternion(slotQ).add(slotO);
}

/* Turned over, the structure comes apart downward: each arm drops down the screen, by an amount that grows
   with how far it hangs below the (now overhead) ground — so the gaps between the arms keep widening — drifting
   a little sideways and turning a little as it goes, each at its own pace, then floats there, bobbing gently. */
const STRETCH = 0.8;      /* an arm drops this × its distance below the ground (0.8: the hanging columns spread to 1.8× their length) */
const FALL_SPEED = 1.5;   /* metres a second, roughly (each arm ±30%) */
const SCATTER = 0.3;      /* sideways drift: this × the drop (each arm a random share of it), plus up to 0.25 m */
const TUMBLE = 0.35;      /* how far an arm turns as it falls, radians at most */
const SNAP = 2.6;         /* coming home: the arms speed up into their places (t^SNAP) and stop there at once */
const vG = new THREE.Vector3();
function planFloat(a) {
  const cw = vA.copy(a.c0).applyMatrix4(content.matrixWorld);
  const ground = vG.set(0, 0, 0).applyMatrix4(content.matrixWorld).y;
  a.drop = Math.max(0, ground - cw.y) * STRETCH + rnd(0.05, 0.25);
  a.anchor = a.c0.clone().addScaledVector(gL, a.drop);
  // a sideways drift, across the fall
  const side = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
  side.addScaledVector(gL, -side.dot(gL)).normalize();
  a.side = side.multiplyScalar(a.drop * SCATTER * rnd(0.2, 1) + rnd(0, 0.25));
  a.anchor.add(a.side);
  a.qA = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize(), rnd(0.25, 1) * TUMBLE).multiply(a.q0);
  a.bobA = rnd(0.04, 0.12); a.bobW = rnd(0.25, 0.5); a.bobP = rnd(0, 2 * PI);
  a.tAx = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize(); a.tA = rnd(0.015, 0.05); a.tW = rnd(0.2, 0.45);
}

function begin(a, type, now) {
  a.c0 = centerOf(a, new THREE.Vector3());
  a.q0 = a.mesh.quaternion.clone();
  a.t0 = now;
  if (type === 'fall') {
    gL.set(0, -1, 0).applyQuaternion(qTmp.copy(world.quaternion).invert());
    planFloat(a);
    a.seq = ++seq;
    a.dur = Math.max(0.7, a.drop / (FALL_SPEED * rnd(0.7, 1.3)));
    a.mode = 'fall';
  } else {
    a.dur = rnd(1.1, 1.4);
    a.mode = 'rise';
  }
}

function floatPose(a, now) {   /* bobbing up and down where it came to rest, tilting a little — no circling */
  const tau = now - a.fT;
  cNow.copy(a.anchor).addScaledVector(a.fG, a.bobA * (Math.sin(a.bobW * tau + a.bobP) - Math.sin(a.bobP)));
  qNow.setFromAxisAngle(a.tAx, a.tA * Math.sin(a.tW * tau)).multiply(a.qA);
}

function updateArm(a, now) {
  if (a.pend && now >= a.pend.at) { const t = a.pend.type; a.pend = null; begin(a, t, now); }
  if (a.mode === 'home') {
    slotPose(a); place(a, slotP, slotQ);
  } else if (a.mode === 'float') {
    floatPose(a, now); place(a, cNow, qNow);
  } else if (a.mode === 'fall') {
    const t = Math.min(1, (now - a.t0) / a.dur), s = 1 - (1 - t) * (1 - t);   // down, easing to rest
    const sd = smooth(0, 1, t);                                                   // the drift and the turn come on gently
    cNow.copy(a.c0).lerp(a.anchor, s).addScaledVector(a.side, sd - s);
    place(a, cNow, qNow.copy(a.q0).slerp(a.qA, sd));
    if (t >= 1) { a.mode = 'float'; a.fT = now; a.fG = gL.clone(); }
  } else if (a.mode === 'rise') {
    const t = Math.min(1, (now - a.t0) / a.dur), s = Math.pow(t, SNAP);   // slow to leave, quickening into place
    slotPose(a);
    vD.copy(slotP);
    vA.copy(X).applyQuaternion(slotQ).setY(0);
    if (vA.lengthSq() > 1e-4) vA.normalize();
    vB.copy(vD).sub(a.c0).multiplyScalar(0.2).add(a.c0); vB.y += 0.5;
    vC.copy(vA).multiplyScalar(1.1).add(vD); vC.y += 0.15;
    bez(cNow, a.c0, vB, vC, vD, s);
    qNow.copy(a.q0).slerp(slotQ, smooth(0, 0.75, t));   // squared up just before it lands
    place(a, cNow, qNow);
    if (t >= 1) a.mode = 'home';
  }
}

/* ---------- loading ---------- */
let texDone = 0;
const reveal = () => stage.classList.add('ready');
setTimeout(() => { if (ready) reveal(); }, 6000);
const tl = new THREE.TextureLoader();
const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
/* an arm's UVs moved to its row of the column's atlas. Each face as seen from outside, upright: s across (0 left),
   t down (0 top) — the same rules as tools/make_atlas.py. Local axes: x along the arm (pivot → tip), y up, z depth. */
function atlasUV(mesh, rects) {
  const g = mesh.geometry = mesh.geometry.clone();
  g.computeBoundingBox();
  const {min, max} = g.boundingBox, P = g.attributes.position, N = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < P.count; i++) {
    const n = [N.getX(i), N.getY(i), N.getZ(i)], ax = n.map(Math.abs).reduce((b, v, k, a) => v > a[b] ? k : b, 0), sg = n[ax] > 0;
    const sx = (P.getX(i) - min.x) / (max.x - min.x), sy = (max.y - P.getY(i)) / (max.y - min.y), sz = (P.getZ(i) - min.z) / (max.z - min.z);
    const [f, s, t] = ax === 2 ? (sg ? ['A', sx, sy] : ['B', 1 - sx, sy])
                    : ax === 0 ? (sg ? ['E', 1 - sz, sy] : ['P', sz, sy])
                    : ['T', sx, sz];
    const r = rects[f];
    uv.setXY(i, r[0] + s * (r[2] - r[0]), r[1] + t * (r[3] - r[1]));
  }
  uv.needsUpdate = true;
}
const colTex = {};
function loadTex(a) {
  const done = () => { if (++texDone >= arms.length) reveal(); };
  const wear = t => {
    t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso;
    const m = a.mesh.material;
    m.map = t; m.color.set('#ffffff'); m.alphaTest = 0.5; m.alphaToCoverage = true; m.needsUpdate = true;
    done();
  };
  ATLAS.then(A => {
    const rects = A && A.arms[a.key];
    if (!rects) { tl.load(texURL(a.key, TEX_SET === 'atlas' ? 'png' : TEX_SET), wear, undefined, done); return; }   // no atlas: the separate textures
    atlasUV(a.mesh, rects);
    colTex[rects.col] ||= new Promise(res => tl.load(`assets/tex/atlas/${A.columns[rects.col].file}`, res, undefined, () => res(null)));
    colTex[rects.col].then(t => t ? wear(t) : done());
  });
}

const onModel = gltf => {
  structure.add(gltf.scene);
  scene.updateMatrixWorld(true);
  const found = [], pivots = [];
  gltf.scene.traverse(o => {
    if (/_Pivot$/.test(o.name)) pivots.push(o);
    if (!o.isMesh) return;
    if (/_Rod$/.test(o.name)) { o.visible = false; return; }
    const m = /^LP_(P\d_Box-\d+)$/.exec(o.name);
    if (m) found.push({mesh: o, key: m[1]});
  });
  /* centre the columns on the plinth */
  const cen = new THREE.Vector3(), p = new THREE.Vector3();
  pivots.forEach(o => cen.add(o.getWorldPosition(p)));
  cen.divideScalar(pivots.length || 1);
  gltf.scene.position.set(-cen.x, 0, -cen.z);
  scene.updateMatrixWorld(true);
  invContent.copy(content.matrixWorld).invert();

  for (const f of found) {
    const mesh = f.mesh, g = mesh.geometry;
    g.computeBoundingBox();
    const lc = g.boundingBox.getCenter(new THREE.Vector3());
    const slot = new THREE.Object3D();
    slot.position.copy(mesh.position); slot.quaternion.copy(mesh.quaternion); slot.scale.copy(mesh.scale);
    mesh.parent.add(slot); mesh.parent.remove(mesh); content.add(mesh);
    mesh.material = LIT
      ? new THREE.MeshStandardMaterial({color: '#83492a', roughness: 0.84, metalness: 0.1, side: THREE.DoubleSide})
      : new THREE.MeshBasicMaterial({color: '#83492a', side: THREE.DoubleSide, toneMapped: false});   // unlit: the texture's own colours
    mesh.castShadow = mesh.receiveShadow = LIT;
    arms.push({mesh, slot, key: f.key, lc, mode: 'home', pend: null, seq: 0});
  }
  scene.updateMatrixWorld(true);
  /* highest arms go first: once inverted they hang lowest */
  order = arms.map(a => ({a, k: slotPose(a).y + Math.random() * 0.35})).sort((p, q) => q.k - p.k).map(o => o.a);
  arms.forEach(loadTex);
  ready = true;
};
const modelFail = err => { console.error('Flux: model could not be loaded', err); };
/* structure.glb first (a fresh Blender export drops straight in); structure.glb.json holds the same bytes in base64 for hosts that won't serve .glb */
const gl = new GLTFLoader();
gl.load('assets/structure.glb', onModel, undefined, () => {
  fetch('assets/structure.glb.json').then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(j => { const bin = Uint8Array.from(atob(j.glb), ch => ch.charCodeAt(0)); gl.parse(bin.buffer, '', onModel, modelFail); })
    .catch(modelFail);
});

/* ---------- input: a tap or click on the image turns it over (and the space bar); scrolling only looks, and turning
   the phone does nothing ---------- */
addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault(); wantFlipped = !wantFlipped;
});

/* ---------- looking up: once inverted, tilt up to the underside of the ground and read ---------- */
/* dir +1: turned over, you look up to the upturned ground (PASSAGES); dir −1: back the right way up after
   reading it, you look down to the ground (PASSAGES_BELOW). The arrow that invites you sits on that side:
   the top one when turned over, the bottom one after. look.dir is set when a look starts and kept until it ends. */
const look = {s: 0, target: 0, dir: 1};
let readAbove = false;
const upBtn = document.getElementById('up'), downBtn = document.getElementById('down'), passage = document.getElementById('passage');
const lookDir = () => flipped ? 1 : -1;
const canLook = () => ready && !anim.on && (flipped || readAbove);
const lookIn = dir => { if (canLook() && lookDir() === dir) { look.dir = dir; look.target = 1; } };
function setPassage() {
  const set = look.dir > 0 ? PASSAGES : PASSAGES_BELOW;
  if (look.dir > 0) readAbove = true;
  const t = set[Math.floor(Math.random() * set.length)];
  passage.replaceChildren(...t.split(/\n\s*\n/).map(par => { const p = document.createElement('p'); p.textContent = par.trim(); return p; }));
  passage.scrollTop = 0;
}
let uiState = '';
function updateLookUI() {
  if (look.s < 0.01 && look.target === 0) look.dir = lookDir();   // at rest: the next look goes the way you now face
  const invite = canLook() && look.dir === lookDir() && look.target < 0.5, back = look.s > 0.5 && look.target > 0.5;
  const st = [invite, back, look.s > 0.92 && look.target > 0.5, look.dir > 0].map(Number).join('');
  if (st === uiState) return;
  if (st[2] === '1' && uiState[2] !== '1') setPassage();
  uiState = st;
  // turned over: ↑ invites, ↓ returns; the right way up: ↓ invites, ↑ returns
  const inviteBtn = look.dir > 0 ? upBtn : downBtn, backBtn = look.dir > 0 ? downBtn : upBtn;
  inviteBtn.classList.toggle('on', invite); inviteBtn.classList.toggle('invite', invite);
  backBtn.classList.toggle('on', back); backBtn.classList.remove('invite');
  upBtn.setAttribute('aria-label', look.dir > 0 ? 'Look up' : 'Look back up');
  downBtn.setAttribute('aria-label', look.dir > 0 ? 'Look back down' : 'Look down');
  passage.classList.toggle('on', st[2] === '1');
}
upBtn.addEventListener('click', () => { if (look.dir > 0) lookIn(1); else look.target = 0; });
downBtn.addEventListener('click', () => { if (look.dir < 0) lookIn(-1); else look.target = 0; });
cv.addEventListener('wheel', e => {
  if (!canLook() && look.target === 0) return;
  const d = -e.deltaY * look.dir;                              // up the screen to look up, down to look down
  if (look.target === 0 && (d <= 0 || lookDir() !== look.dir)) return;
  e.preventDefault(); look.dir = look.target === 0 ? lookDir() : look.dir;
  look.target = Math.min(1, Math.max(0, look.target + d * 0.0015));
}, {passive: false});
/* the passage scrolls itself; at its ends the wheel carries on to the view (back the way you came) */
passage.addEventListener('wheel', e => {
  const atTop = passage.scrollTop <= 0, atEnd = passage.scrollTop + passage.clientHeight >= passage.scrollHeight - 1;
  if ((e.deltaY < 0 && !atTop) || (e.deltaY > 0 && !atEnd)) return;
  e.preventDefault();
  if (e.deltaY * look.dir > 0) look.target = Math.min(1, Math.max(0, look.target - Math.abs(e.deltaY) * 0.0015));
}, {passive: false});
addEventListener('keydown', e => {
  if (e.code !== 'ArrowUp' && e.code !== 'ArrowDown') return;
  e.preventDefault();
  const d = e.code === 'ArrowUp' ? 1 : -1;
  if (look.target > 0.5 && d !== look.dir) look.target = 0; else lookIn(d);
});

/* ---------- postcard (explorations/shared/postcard.js): the view as it is, drawn again with its long side at 1800 px ---------- */
TPPostcard.attach(document.getElementById('postcard'), () => {
  const w = stage.clientWidth, h = stage.clientHeight, pr = renderer.getPixelRatio();
  renderer.setPixelRatio(1800 / Math.max(w, h)); renderer.setSize(w, h, false);
  renderer.render(scene, camera);
  const out = document.createElement('canvas'); out.width = renderer.domElement.width; out.height = renderer.domElement.height;
  out.getContext('2d').drawImage(renderer.domElement, 0, 0);          // read straight after drawing
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
  return out;
}, 'flux');

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let lastT = 0;
renderer.setAnimationLoop(() => {
  const now = clock.getElapsedTime(), dt = Math.min(0.05, now - lastT); lastT = now;

  if (!drag) { view.az += view.vel * dt; view.vel *= Math.exp(-3 * dt); }
  camera.position.set(Math.sin(view.az) * view.dist, EYE, Math.cos(view.az) * view.dist);
  camera.lookAt(0, EYE, 0);
  look.s += (look.target - look.s) * Math.min(1, dt * 1.6);
  if (Math.abs(look.target - look.s) < 1e-4) look.s = look.target;
  if (look.s > 0) camera.rotateX(ease(look.s) * LOOK_MAX * look.dir);
  updateLookUI();

  if (ready && !anim.on) {
    if (flipped !== wantFlipped) startAnim(true, false, now);
  }
  if (anim.on) {
    let t = (now - anim.t0) / anim.dur;
    if (t >= 1) { t = 1; anim.on = false; }
    const e = ease(t);
    qFlip.setFromAxisAngle(anim.axis, anim.g * e).multiply(anim.q0);
    if (!anim.on) qFlip.normalize();
    rollDeg = anim.r0 + (anim.r1 - anim.r0) * e;
    stage.style.transform = rollDeg % 360 ? `rotate(${rollDeg % 360}deg)` : '';
  }

  spinV += ((flipped && !anim.on ? SPIN_SPEED : 0) - spinV) * Math.min(1, dt * 0.6);
  spin += spinV * dt;
  world.quaternion.copy(qFlip);
  structure.rotation.y = spin;
  world.updateMatrixWorld(true);
  invContent.copy(content.matrixWorld).invert();

  for (const a of arms) updateArm(a, now);
  renderer.render(scene, camera);
});
}
</script>
</body>
