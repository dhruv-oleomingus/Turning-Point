<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Title of exploration — Turning Point</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/explore.css?v=20261126b">
  <style>
    /* TEMPLATE for a new exploration: copy this folder. Every piece sits in one frame the shape of a postcard
       (#work, placed by explore.js), with Back and Postcard beside it (explorations/shared). */
    html, body { background: var(--surround); overflow: hidden; }
    #work { background: var(--paper); color: var(--ink); overflow: hidden; }
    .xread { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: clamp(26px, 7%, 84px) clamp(24px, 7.5%, 104px); }
    .xread h1 { margin: 0; font: 700 clamp(30px, 3.2vw, 56px)/1 var(--display); }
    .xread .status { margin: .9em 0 2.2em; font-size: var(--small); letter-spacing: .2em; text-transform: uppercase; color: var(--soft); }
    .xread .body { column-gap: clamp(28px, 4%, 64px); }
    .xread .body p { margin: 0 0 1em; font: 400 clamp(15px, .95vw + 2px, 19px)/1.55 var(--sans); break-inside: avoid-column; }
    #work.is-wide .xread .body { column-count: 2; }
  </style>
</head>
<body>
  <nav class="xrail" aria-label="Turning Point">
    <a class="xback" href="../../index.html#explore">Back</a>
    <button type="button" class="xcard" id="postcard" title="Download this page as a postcard (PDF)">Postcard</button>
  </nav>

  <!-- Your piece goes here, inside #work (the frame): a canvas, p5.js sketch, Three.js scene, video …
       Size it to #work: frame() below places #work on every resize. Then add a { type: "project", … }
       box for it in js/content.js. -->
  <main id="work">
    <article class="xread">
      <h1>Title of exploration</h1>
      <p class="status">In progress — the piece will play here</p>
      <div class="body"><p>A short text about this exploration.</p></div>
    </article>
  </main>

  <script src="../shared/explore.js?v=20261126a"></script>
  <script src="../../js/postcard.js?v=20261126a"></script>
  <script src="../shared/postcard.js?v=20261126b"></script>
  <script>
    const work = document.getElementById("work");
    function frame() {
      const m = TPX.upright() ? 56 : Math.round(innerHeight * 0.03);
      const r = TPX.fit({ top: m, bottom: m, side: innerWidth > 820 ? 170 : 8 });
      TPX.place(work, r); TPX.rail(r);
      work.classList.toggle("is-wide", !r.upright && r.w > 720);
    }
    frame(); addEventListener("resize", frame);
    // the postcard's front: here the title and words, typeset; for a piece, hand over a canvas of the frame instead
    // (draw it again at 1800 px on its long side and copy it straight after drawing — see perforation or flux)
    const paras = [...document.querySelectorAll(".xread .body p")].map(p => p.textContent);
    TPPostcard.attach(document.getElementById("postcard"),
      () => TPPostcard.textFront(document.querySelector(".xread h1").textContent, paras, 1800, 1200), "exploration");
  </script>
</body>
</html>
