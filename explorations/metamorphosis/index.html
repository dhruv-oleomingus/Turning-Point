<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf6" />
    <title>Metamorphosis — Turning Point</title>
    <meta name="description" content="A web accompaniment to Turning Point — scroll to turn the column." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="./assets/index-Bhx-Jihu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-LaL7Vu0w.css">
    <!-- In the site: the shared frame (the postcard's shape, on a grey surround), the site's type, and Back and
         Postcard beside the frame (explorations/shared). The piece itself (assets/index-*.js) is untouched: it
         sizes itself to #stage, which is placed below; its WebGL canvas keeps its drawing so a postcard can be taken. -->
    <link rel="stylesheet" href="../shared/explore.css?v=20261126b">
    <!-- the passage inside the structure: Noto Serif italic (the risograph print is in assets/index-*.js, Cf) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@1,400&display=swap">
    <style>
      :root { --bg: #fbfaf6; }                  /* the paper, nearer white (as the piece's own background) */
      html, body { background: var(--surround); }
      body, #title, #caption, #hint, #counter, #loader { font-family: Roboto, Arial, sans-serif; }
      #stage { box-shadow: none; }
      #ui { overflow: hidden; }
      .in-site #title { top: max(28px, env(safe-area-inset-top)); }
    </style>
    <script>
      (function () {   // keep the drawing on the piece's canvas (for the postcard)
        const get = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type, opts) {
          if (/webgl/.test(type) && this.id === "stage") opts = Object.assign({}, opts, { preserveDrawingBuffer: true });
          return get.call(this, type, opts);
        };
      })();
    </script>
  </head>
  <body>
    <canvas id="stage" aria-label="Turning Point — an interactive column. Scroll or swipe to turn it."></canvas>
    <nav class="xrail" aria-label="Turning Point">
      <a class="xback" href="../../index.html#explore">Back</a>
      <button type="button" class="xcard" id="postcard" title="Download this view as a postcard (PDF)">Postcard</button>
    </nav>
    <div id="ui">
      <div id="loader"><span>Turning Point</span><div class="bar"><i></i></div></div>
      <div id="title" class="hidden">Turning Point</div>
      <div id="caption" class="hidden"></div>
      <div id="hint" class="hidden">scroll</div>
      <div id="counter" aria-hidden="true">0000°</div>
    </div>
    <script src="../shared/explore.js?v=20261126a"></script>
    <script src="../../js/postcard.js?v=20261126a"></script>
    <script src="../shared/postcard.js?v=20261126b"></script>
    <script>
      document.body.classList.add('in-site');
      const stageEl = document.getElementById('stage'), uiEl = document.getElementById('ui');
      function frame() {
        const m = TPX.upright() ? 56 : Math.round(innerHeight * 0.03);
        const r = TPX.fit({ top: m, bottom: m, side: innerWidth > 820 ? 170 : 8 });
        TPX.place(stageEl, r); TPX.place(uiEl, r); TPX.rail(r);
      }
      frame(); addEventListener('resize', frame);
      TPPostcard.attach(document.getElementById('postcard'), () => {
        const out = document.createElement('canvas'); out.width = stageEl.width; out.height = stageEl.height;
        out.getContext('2d').drawImage(stageEl, 0, 0);
        return out;
      }, 'metamorphosis', { bg: '#fbfaf6' });   // an upright view (phone) sits whole on the card, on the piece's paper
    </script>
  </body>
</html>
